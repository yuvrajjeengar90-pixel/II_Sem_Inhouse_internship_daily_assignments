<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    transition:0.4s;
}

.container-box{
    width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
    transition:0.3s;
}

.container-box:hover{
    transform:translateY(-8px);
}

h1{
    color:#0d6efd;
    margin-bottom:20px;
}

#count{
    font-size:70px;
    font-weight:bold;
    color:#198754;
    margin:25px 0;
}

.btn{
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.dark-mode{
    background:#212529;
}

.dark-mode .container-box{
    background:#343a40;
    color:white;
}

.dark-mode h1{
    color:#ffc107;
}

.dark-mode #count{
    color:#20c997;
}
</style>

</head>
<body>

<div class="container-box">

    <h1>Counter App</h1>

    <h2 id="count">0</h2>

    <div class="d-grid gap-3">

        <button class="btn btn-success" id="plus">
            ➕ Increment
        </button>

        <button class="btn btn-danger" id="minus">
            ➖ Decrement
        </button>

        <button class="btn btn-warning" id="reset">
            🔄 Reset
        </button>

        <button class="btn btn-dark" id="mode">
            🌙 Dark Mode
        </button>

    </div>

</div>

<script>

let count = 0;

$("#plus").click(function(){

    count++;

    $("#count").text(count);

});

$("#minus").click(function(){

    count--;

    $("#count").text(count);

});

$("#reset").click(function(){

    count = 0;

    $("#count").text(count);

});

$("#mode").click(function(){

    $("body").toggleClass("dark-mode");

    if($("body").hasClass("dark-mode")){

        $(this)
        .removeClass("btn-dark")
        .addClass("btn-light")
        .text("☀️ Light Mode");

    }

    else{

        $(this)
        .removeClass("btn-light")
        .addClass("btn-dark")
        .text("🌙 Dark Mode");

    }

});

</script>

</body>
</html>
