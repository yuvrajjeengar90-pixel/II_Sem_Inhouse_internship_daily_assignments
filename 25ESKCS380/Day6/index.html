<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Directory</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Post Directory</a>

            <span class="badge bg-warning text-dark" id="cardCount">
                0 Posts
            </span>
        </div>
    </nav>


    <div class="container my-5">

        <h1 class="text-center mb-4">JSONPlaceholder Posts</h1>

        <!-- Search -->
        <div class="row justify-content-center mb-4">

            <div class="col-md-6">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search posts by title...">

            </div>

        </div>


        <!-- Loading -->
        <div id="loading" class="text-center">

            <div class="spinner-border text-primary"></div>

            <p class="mt-2">Loading Posts...</p>

        </div>


        <!-- Error -->
        <div
            id="errorMessage"
            class="alert alert-danger text-center d-none">
        </div>


        <!-- Cards -->
        <div class="row g-4" id="postContainer"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
